<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lights Out</title>
  <meta name="description" content="Top-down arcade Formula racing. Play in the browser or add it to your home screen.">
  <meta name="theme-color" content="#0d1016">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lights Out">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@600;800;900&family=Titillium+Web:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Race view"></canvas>
  <div id="insets" aria-hidden="true"></div>

  <div id="touch" class="touch" hidden>
    <div class="steer-pad" aria-label="Steering: slide left or right">
      <span class="steer-arrow l" aria-hidden="true">‹</span>
      <span class="steer-arrow r" aria-hidden="true">›</span>
      <span class="steer-center" aria-hidden="true"></span>
      <span class="steer-knob" aria-hidden="true"></span>
    </div>
    <div class="pedal" aria-label="Pedal: slide up for gas, down for brake">
      <span class="pedal-label gas">GAS</span>
      <span class="pedal-label brake">BRAKE</span>
      <span class="pedal-knob" aria-hidden="true"></span>
    </div>
  </div>
  <button id="pauseBtn" class="pause-btn" aria-label="Pause" hidden><i></i></button>

  <div id="ui"></div>

  <div class="rotate" id="rotate" aria-live="polite"><div class="rotate-card"><i class="rotate-phone" aria-hidden="true"></i><b>Turn your phone sideways</b><span>Lights Out is played in landscape.</span></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
