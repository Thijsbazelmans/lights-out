<title>Lights Out</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@600;800;900&family=Titillium+Web:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">

<canvas id="game" aria-label="Race view"></canvas>
<div id="insets" aria-hidden="true"></div>

<div id="touch" class="touch" hidden>
  <div class="tbtns steer-btns" aria-label="Steering buttons: left and right"><span class="tbtn left" aria-hidden="true">‹</span><span class="tbtn right" aria-hidden="true">›</span></div>
  <div class="tbtns pedal-btns" aria-label="Brake and gas buttons"><span class="tbtn gas">GAS</span><span class="tbtn brake">BRAKE</span></div>
</div>
<button id="pauseBtn" class="pause-btn" aria-label="Pause" hidden><i></i></button>

<div id="ui"></div>

<div class="rotate" id="rotate" aria-live="polite"><div class="rotate-card"><i class="rotate-phone" aria-hidden="true"></i><b>Turn your phone sideways</b><span>Lights Out is played in landscape.</span></div></div>

<script type="module" src="js/main.js"></script>
