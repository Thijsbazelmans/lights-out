<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@600;800;900&family=Titillium+Web:wght@400;600;700&display=swap">
<style>
  :root { --bg: #0d1016; --fg: #eef2f8; --muted: #8d97ab; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; padding: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figcaption { color: var(--muted); font: 12px ui-monospace, monospace; margin-top: 4px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
</style>
</head>
<body>
<p>Developer tool: single frames of a race, set up and drawn with the game's own code, to check effects and the HUD without playing. <code>?w=740&amp;h=360</code> for a phone held sideways, <code>?zoom=2</code> to look closer, <code>?only=spa</code> for one circuit's scenes (pit stops: <code>?only=monza,monaco</code>), <code>?calls</code> for every corner call card.</p>
<div class="grid" id="grid"></div>
<script type="module">
import { Track } from '../js/track.js';
import { ALL_REAL } from '../js/data/tracks.js';
import { Race } from '../js/race.js';
import { AIDriver } from '../js/ai.js';
import { Camera } from '../js/camera.js';
import { PHYS } from '../js/car.js';
import { drawHUD } from '../js/hud.js';
import { playerFor, rivalsFor } from '../js/data/teams.js';

const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 800);
const H = Number(q.get('h') || 500);
const phone = W < 768;
const ZOOM = Number(q.get('zoom') || 1);
const ONLY = q.get('only');
const grid = document.getElementById('grid');
await document.fonts.load('900 20px "Saira Condensed"').catch(() => {});

// Each scene: a circuit, then a script that sets up the moment (and for a
// qualifying scene, QUALI).
const QUALI = { mode: 'quali' };
const scenes = [
  ['monza', 'corner call: chicane ahead', (r, t, p, run) => { place(r, t, p, 0.06, 740); run(30, () => ({ gas: 1 })); }],
  ['monza', 'BRAKE! at the 1 board', (r, t, p, run) => { place(r, t, p, 0.07, 740); run(400, (k) => ({ gas: 1, stop: r.call && r.call.stage === 'brake' })); }],
  ['silverstone', 'slipstream behind a car', (r, t, p, run) => {
    const o = r.cars.find((c) => c !== p);
    place(r, t, p, 0.08, 700); placeCar(t, o, 0.08, 700, 140);
    run(40, () => ({ gas: 1 }), (dt) => { o.vx = Math.cos(o.angle) * 700; o.vy = Math.sin(o.angle) * 700; });
  }],
  ['suzuka', 'drifting', (r, t, p, run) => {
    place(r, t, p, 0.06, 600);
    // Brake while turning into turn 1 to start the drift, then hold it.
    run(85, (k) => {
      const turning = Math.abs(t.rcurv[(p.trackIdx + 20) % t.n]) > 1 / 400;
      return turning && k > 5 ? { brake: 1, steer: 1 } : { gas: 1 };
    });
  }],
  ['bahrain', 'off the road', (r, t, p, run) => { place(r, t, p, 0.2, 600, 100); run(25, () => ({ gas: 1 })); }],
  ['spa', 'hard braking', (r, t, p, run) => { place(r, t, p, 0.37, 720); run(18, () => ({ brake: 1 })); }],
  ['austria', 'worn tyres and a damaged car', (r, t, p, run) => {
    place(r, t, p, 0.15, 600);
    p.tyres = 0.51;
    p.damage = 0.46;
    run(40, () => ({ gas: 1 }));
    p.hitT = 0.5;
  }],
  ['monza', 'pit entry coming up', (r, t, p, run) => { placeK(r, t, p, t.pit.start - 150, 650, 20); run(10, () => ({ gas: 1 })); }],
  ['monza', 'turning into the pit lane', (r, t, p, run) => { placeK(r, t, p, t.pit.start - 30, 650, t.half - 8); run(40, () => ({ gas: 1, steer: 0 })); }],
  ['monza', 'pit stop: wheel guns', (r, t, p, run) => {
    placeK(r, t, p, t.pit.start - 20, 620, t.half - 8);
    run(1200, (k) => {
      const g = r.pits.game;
      if (g && g.wheel === 2 && g.phase === 'wheels' && g.pt > 0.15) return { stop: true };
      return { gas: 1, steer: 0, pedal: !!g && g.phase === 'wheels' && g.gun <= 0 && Math.abs(g.m - g.zone) < 0.05 };
    });
  }],
  ['monza', 'pit stop: waiting for the front wing', (r, t, p, run) => {
    p.damage = 0.6;
    placeK(r, t, p, t.pit.start - 20, 620, t.half - 8);
    run(1500, (k) => {
      const g = r.pits.game;
      if (g && g.phase === 'jackDown' && g.pt > 0.45) return { stop: true };
      return { gas: 1, steer: 0, pedal: !!g && g.phase === 'wheels' && g.gun <= 0 && Math.abs(g.m - g.zone) < 0.05 };
    });
  }],
  ['monza', 'pit stop: held for traffic (staged)', (r, t, p, run) => {
    placeK(r, t, p, t.pit.start - 20, 620, t.half - 8);
    run(1500, (k) => {
      const g = r.pits.game;
      if (g && g.phase === 'light' && g.pt > g.hold) { g.green = false; g.waiting = true; return { stop: true }; }
      return { gas: 1, steer: 0, pedal: !!g && g.phase === 'wheels' && g.gun <= 0 && Math.abs(g.m - g.zone) < 0.05 };
    });
  }],
  ['monza', 'pit stop: a car waits to let you out', (r, t, p, run) => {
    // A line of cars comes down the lane as your light is due: held for a
    // moment, then the next car stops behind your box until you're out.
    placeK(r, t, p, t.pit.start - 20, 620, t.half - 8);
    let train = false;
    run(2400, (k) => {
      const g = r.pits.game;
      if (g && g.phase === 'light' && !train) {
        train = true;
        const boxK = t.pit.boxes[p.box];
        r.cars.filter((c) => c !== p && c.box > p.box).slice(0, 7).forEach((c, i) => {
          const kk = boxK - (40 + 62 * i) / t.ds;
          c.frozen = false;
          c.pit = { stage: 'in', k: kk, lat: t.pitLane(kk), err: 0, v: 230, t: 0, swung: 0, braking: false, at: r.time };
        });
      }
      if (g && g.green && r.cars.some((c) => c.pit && c.pit.stage === 'in' && c.pit.v < 3 && r.pits.inLane(c))) return { stop: true };
      return { gas: 1, steer: 0, pedal: !!g && g.phase === 'wheels' && g.gun <= 0 && Math.abs(g.m - g.zone) < 0.05 };
    });
  }],
  ['monza', 'pit stop: release, front wing', (r, t, p, run) => {
    p.damage = 0.32;
    placeK(r, t, p, t.pit.start - 20, 620, t.half - 8);
    run(1500, (k) => {
      const g = r.pits.game;
      if (g && g.phase === 'light' && g.pt > 0.05) return { stop: true };
      return { gas: 1, steer: 0, pedal: !!g && g.phase === 'wheels' && g.gun <= 0 && Math.abs(g.m - g.zone) < 0.05 };
    });
  }],
  ['monza', 'last chance to stop', (r, t, p, run) => { p.lap = 1; placeK(r, t, p, t.pit.start - 150, 650, 20); run(10, () => ({ gas: 1 })); }],
  ['monaco', 'pit lane, outside of the lap', (r, t, p, run) => { placeK(r, t, p, t.pit.start - 2, 620, t.half - 6); run(150, () => ({ gas: 1, steer: 0 })); }],
  // Qualifying: the whole session driven by the bot (`auto`).
  ['monza', 'qualifying: in the garage', (r, t, p, run) => run(50, () => ({ auto: true })), QUALI],
  ['monza', 'qualifying: leaving the pit lane', (r, t, p, run) => run(330, () => ({ auto: true })), QUALI],
  ['monza', 'qualifying: out-lap, times coming in', (r, t, p, run) => run(9000, () => ({ auto: true, stop: r.time > 24 })), QUALI],
  ['monza', 'qualifying: chasing the pole ghost', (r, t, p, run) => run(9000, () => ({ auto: true, stop: r.quali.stage === 'flying' && r.time - p.lapStart > 2.2 })), QUALI],
  ['monza', 'qualifying: flying lap', (r, t, p, run) => run(9000, () => ({ auto: true, stop: r.quali.stage === 'flying' && r.time - p.lapStart > 21 })), QUALI],
  ['monza', 'qualifying: lap done', (r, t, p, run) => run(9000, () => ({ auto: true, stop: r.phase === 'finished' && r.finishReal > 1.7 })), QUALI],
  ['monaco', 'qualifying: garage, outside of the lap', (r, t, p, run) => run(250, () => ({ auto: true })), QUALI],
];

// Like placeCar, at signed sample k (negative before the line), `lat` px
// right of the centre line, and on lap 0 so the pit entry is open.
function placeK(r, t, p, k, speed, lat = 0) {
  r.phase = 'race';
  r.time = 20;
  for (const c of r.cars) { c.frozen = false; if (c !== p) { c.x = -1e6; c.y = -1e6; } }
  const i = ((k % t.n) + t.n) % t.n;
  const a = Math.atan2(t.ty[i], t.tx[i]);
  const off = lat * t.pit.side;
  p.x = t.px[i] + t.nx[i] * off;
  p.y = t.py[i] + t.ny[i] * off;
  p.angle = a;
  p.vx = Math.cos(a) * speed;
  p.vy = Math.sin(a) * speed;
  p.trackIdx = i;
  p.lapArmed = true;
  p.frozen = false;
  p.launchPenalty = 0;
}

function place(r, t, p, frac, speed, lat = 0) {
  r.phase = 'race';
  r.time = 20;
  for (const c of r.cars) { c.frozen = false; if (c !== p) { c.x = -1e6; c.y = -1e6; } }
  placeCar(t, p, frac, speed, 0, lat);
}

function placeCar(t, c, frac, speed, ahead = 0, lat = 0) {
  const i0 = Math.round(frac * t.n);
  const i = (i0 + Math.round(ahead / t.ds)) % t.n;
  const a = Math.atan2(t.ty[i], t.tx[i]);
  c.x = t.px[i] + t.nx[i] * (t.roff[i] + lat);
  c.y = t.py[i] + t.ny[i] * (t.roff[i] + lat);
  c.angle = a;
  c.vx = Math.cos(a) * speed;
  c.vy = Math.sin(a) * speed;
  c.trackIdx = i;
  c.frozen = false;
  c.launchPenalty = 0;
}

// Every corner call card, for checking the arrows.
if (q.has('calls')) {
  const { drawCall } = await import('../js/hud.js');
  const cards = [['lift', -1], ['lift', 1], ['hard', -1], ['hard', 1], ['hairpin', -1], ['hairpin', 1], ['chicane', -1], ['chicane', 1]];
  const cv = document.createElement('canvas');
  cv.width = 520; cv.height = 56 * 4 + 16;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#2d4a26';
  ctx.fillRect(0, 0, cv.width, cv.height);
  cards.forEach(([kind, dir], k) => {
    const note = { c: { kind, dir, brake: kind !== 'lift' }, stage: 'warn', t: 1, fade: 1, tt: 0.6, warnAt: 1.4 };
    drawCall(ctx, note, 130 + (k % 2) * 260, 8 + Math.floor(k / 2) * 56, 214, 0);
  });
  const fig = document.createElement('figure');
  fig.appendChild(cv);
  grid.appendChild(fig);
}

for (const [id, label, script, opts] of q.has('calls') ? [] : scenes) {
  if (ONLY && !ONLY.split(',').includes(id)) continue;
  const t = new Track(ALL_REAL.find((d) => d.id === id));
  const quali = opts === QUALI;
  const r = new Race({ track: t, mode: quali ? 'quali' : 'race', laps: 3, player: playerFor('ferrari', 1), rivals: rivalsFor('ferrari', 1) });
  const p = r.player;
  if (quali) r.event = { gp: t.def.gp, name: t.def.name, country: t.def.country, accent: t.def.theme.thumb, mode: 'quali', laps: 3, round: 5, rounds: 24 };
  else {
    r.ai.clear();
    p.lap = 0;
  }
  const cam = new Camera();
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const bot = new AIDriver(p, t, { pace: 1 });
  const run = (frames, ctl, each) => {
    for (let k = 0; k < frames; k++) {
      const c = ctl(k);
      if (c.stop) break;
      if (c.auto) {
        const drive = r.phase === 'race' && !p.pit && !p.finished;
        r.update(1 / 60, drive ? { ...bot.control(1 / 60, r.cars, 1, r.time), pedal: false } : { gas: 0, brake: 0, steer: 0, analog: true });
      } else {
        const steer = c.steer ?? (p.pit ? 0 : bot.control(1 / 60, r.cars, 1, r.time).steer);
        r.update(1 / 60, { gas: c.gas || 0, brake: c.brake || 0, steer, analog: true, pedal: !!c.pedal });
      }
      each?.(1 / 60);
      cam.update(1 / 60, p, { w: W, h: H, mode: 'chase', touchUI: phone, speedFrac: Math.max(0, p.forwardSpeed) / PHYS.TOP, boost: p.boost > 0, zoomMul: ZOOM });
    }
  };
  script(r, t, p, run);
  r.focus = p;
  r.draw(ctx, cam, W, H, 1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const ctl = phone ? { steer: new DOMRect(16, H - 108, 196, 92), pedal: new DOMRect(W - 120, H - 204, 104, 188), gas: new DOMRect(W - 120, H - 204, 104, 84) } : null;
  drawHUD(ctx, r, cam, W, H, { top: 0, left: 0, right: 0, bottom: 0 }, { touchUI: phone, ctl, dt: 1 / 60, season: quali });
  const fig = document.createElement('figure');
  fig.appendChild(cv);
  const cap = document.createElement('figcaption');
  cap.textContent = `${t.name}: ${label}  (${Math.round(p.forwardSpeed * 0.447)} km/h, slipstream ${p.slipstream.toFixed(2)}, ${p.drifting ? 'drifting' : 'gripping'}${p.offTrack ? ', off track' : ''}, tyres ${Math.round(p.tyres * 100)}%, car ${Math.round((1 - p.damage) * 100)}%${r.call ? `, call ${r.call.c.kind} ${r.call.stage}` : ''})`;
  fig.appendChild(cap);
  grid.appendChild(fig);
}
</script>
</body>
</html>
